spring.application.name=spring-jte-blogapp

# Production/jar setup: the Gradle plugin precompiles templates at build time,
# and this tells JTE to load those classes rather than compile from source.
# Both matter — precompiling alone gives you
# "You need to either set gg.jte.usePrecompiledTemplates or gg.jte.developmentMode to true",
# and development mode alone gives you
# "For self contained applications jte templates must be precompiled" from a jar.
gg.jte.use-precompiled-templates=true
gg.jte.development-mode=false

spring.datasource.url=jdbc:h2:mem:blogdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
